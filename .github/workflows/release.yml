name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            archive: tar
          - os: macos-13
            target: macos-x64
            archive: tar
          - os: macos-latest
            target: macos-arm64
            archive: tar
          - os: windows-latest
            target: windows-x64
            archive: zip
    env:
      TARGET: ${{ matrix.target }}
      ARCHIVE: ${{ matrix.archive }}
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Analyze
        run: dart analyze

      - name: Test
        run: dart test

      - name: Compile native executable
        run: |
          mkdir -p build
          dart compile exe bin/flsweep.dart --output build/flsweep

      - name: Package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ "$ARCHIVE" = "zip" ]; then
            out="flsweep-${version}-${TARGET}.zip"
            7z a "$out" ./build/flsweep.exe
            bin="$out"
          else
            out="flsweep-${version}-${TARGET}.tar.gz"
            tar -czf "$out" -C build flsweep
            bin="$out"
          fi
          shasum -a 256 "$bin" > "flsweep-${version}-checksums.txt" || sha256sum "$bin" > "flsweep-${version}-checksums.txt"
          cat "flsweep-${version}-checksums.txt"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: flsweep-*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
